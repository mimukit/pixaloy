<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pixaloy fixture: basic</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 sans-serif;
      }
      .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: #222;
        color: #fff;
        z-index: 9999;
      }
      main {
        margin-top: 64px;
        padding: 16px;
      }
      .card {
        width: 300px;
        margin: 20px;
        padding: 12px;
        border: 4px solid #333;
        background: #f5f5f5;
      }
      .card p {
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <header class="header">Fixed header</header>
    <main id="main">
      <section id="list" class="list">
        <div id="first" class="card first">
          <h2 id="title" class="card-title">First card</h2>
          <p id="text">Some text.</p>
        </div>
        <div id="second" class="card second">
          <button id="counter" type="button">Clicked 0</button>
        </div>
        <div id="third" class="card third">Third card</div>
      </section>
    </main>
    <script>
      window.pageClicks = 0;
      document.addEventListener('click', () => {
        window.pageClicks += 1;
      });
      const button = document.getElementById('counter');
      let count = 0;
      button.addEventListener('click', () => {
        count += 1;
        button.textContent = `Clicked ${count}`;
      });
    </script>
  </body>
</html>
